name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. pilothouse setup\n2. start claude in a repo\n3. ..."
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: "`pilothouse version` and `pilothouse doctor` output"
      render: text
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version (e.g. Claude Code 2.1.x, Codex 0.x)
  - type: textarea
    id: log
    attributes:
      label: Relevant `pilothouse log` lines (remove anything private)
      render: text
