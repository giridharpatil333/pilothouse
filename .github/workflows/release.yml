name: release
# Manual for now: releases are cut locally with `goreleaser release --clean`.
# To automate, add a HOMEBREW_TAP_TOKEN secret (fine-grained, contents:write on
# xasdta/homebrew-tap) and switch this back to `push: tags: ["v*"]`.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A fine-grained token with contents:write on xasdta/homebrew-tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
